# .gitguardian.yaml — GitGuardian ignore rules for the Lisible repository.
version: 2

secret:
  # The Adsterra ad placement IDs below are PUBLIC BY DESIGN: they are shipped
  # inside the client-side JavaScript bundle served to every visitor of the
  # site (like a Google AdSense publisher ID). They identify ad slots, grant
  # no account access, and cannot be "revoked" meaningfully — rotating them
  # would break ads while the new IDs would look identical to scanners.
  # Hence they are excluded from secret scanning (known false positive,
  # flagged 2026-09-25 as "Generic High Entropy Secret").
  ignored-paths:
    - components/adsterraPlacements.js
  ignored-matches:
    - name: "Adsterra Banner placement 320x50 (public)"
      match: "eb9d208147a7b0a64dee236e0a932000"
    - name: "Adsterra Banner placement 300x250 (public)"
      match: "4a3b4d7f7692b70cb950f0f6bc4d046f"
    - name: "Adsterra Banner placement 728x90 (public)"
      match: "9d4b8ea21decef12c84008344a719e55"
    - name: "Adsterra Banner placement 468x60 (public)"
      match: "bfd649241974036ee3097983a2d7cc69"
    - name: "Adsterra Banner placement 160x600 (public)"
      match: "59f8dfd72079a6439c45f3f067a6ef28"
    - name: "Adsterra Banner placement 160x300 (public)"
      match: "c3be5953aaf4d8cc42cb3d3ae6d2c2ea"
